<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: permite usar a tela toda em aparelhos com "notch" (o CSS
         respeita as áreas seguras com env(safe-area-inset-*)) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#082a1f" />
    <title>Clima Agora</title>

    <!-- Inter: tipografia moderna com pesos finos (200/300), essenciais para a temperatura gigante.
         Se estiver offline, o CSS cai para a fonte do sistema (system-ui). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
